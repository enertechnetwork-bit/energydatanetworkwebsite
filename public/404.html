<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Energy Data Technology</title>
    <script>
      // Redirect all 404s to the main app for client-side routing
      const path =
        window.location.pathname +
        window.location.search +
        window.location.hash;
      window.location.replace("/" + "?redirect=" + encodeURIComponent(path));
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/" />
    </noscript>
  </body>
</html>
